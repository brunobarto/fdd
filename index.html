<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multimedia Shop — Sales Performance</title>
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;800;900&display=swap)" rel="stylesheet">
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js)"></script>
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js)"></script>
<style>
:root{--accent:#D62828;--red:#D62828;--blue:#1F4E9E;--yellow:#F2B705}
[data-theme=light]{--bg:#F1ECE2;--fg:#111;--muted:#555;--card:#fff;--line:#111;--grid:rgba(0,0,0,.08);--star:17,17,17}
[data-theme=dark]{--bg:#0D0D10;--fg:#F1ECE2;--muted:#9a9a9a;--card:#17171b;--line:#F1ECE2;--grid:rgba(255,255,255,.08);--star:241,236,226}
*{box-sizing:border-box;cursor:inherit!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inconsolata,monospace;background:var(--bg);color:var(--fg);transition:background .5s,color .5s;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#progress{position:fixed;top:0;left:0;height:4px;background:var(--accent);z-index:60;width:0}
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:clip-path 1s cubic-bezier(.8,0,.2,1)}
#loader.done{clip-path:inset(0 0 100% 0);pointer-events:none}
.lshapes{display:flex;gap:14px;align-items:flex-end}
.lshapes i{display:block;width:34px;height:34px;animation:hop 1s infinite cubic-bezier(.6,0,.4,1)}
.lshapes .c{border-radius:50%;background:var(--red)}
.lshapes .s{background:var(--blue);animation-delay:.15s}
.lshapes .t{width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-bottom:34px solid var(--yellow);animation-delay:.3s}
@keyframes hop{50%{transform:translateY(-18px) rotate(90deg)}}
#lbar{display:flex;gap:4px;padding:6px;border:3px solid var(--line)}
#lbar i{width:14px;height:26px;background:var(--grid);transition:background .15s}
#lbar i.on{background:var(--accent)}
#lpct{font-size:44px;font-weight:900;letter-spacing:2px}
#lmsg{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
header.top{position:fixed;top:4px;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 4vw;backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:2px}
.logo i{width:14px;height:14px;display:inline-block}
.logo .c{background:var(--red);border-radius:50%}.logo .s{background:var(--blue)}
.logo .t{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--yellow)}
.ctrls{display:flex;gap:10px;align-items:center}
.btn{font-family:inherit;font-weight:800;font-size:13px;background:var(--card);color:var(--fg);border:2px solid var(--line);padding:7px 11px;box-shadow:3px 3px 0 var(--accent);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--accent)}
.lang span{opacity:.35}.lang span.on{opacity:1;color:var(--accent)}
.theme{width:42px;height:36px;position:relative;overflow:hidden;padding:0}
.theme svg{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;transition:transform .5s,opacity .5s}
[data-theme=light] .moon,[data-theme=dark] .sun{transform:translateY(30px) rotate(90deg);opacity:0}
.swatches{display:flex;gap:5px;align-items:center;border:2px solid var(--line);padding:6px;background:var(--card)}
.sw{width:18px;height:18px;border:2px solid var(--line);padding:0}
.sw.c{border-radius:50%}
.sw.t{clip-path:polygon(50% 0,100% 100%,0 100%);border:none}
.sw.pick{position:relative;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.pick input{position:absolute;inset:0;opacity:0}
main{position:relative;z-index:1}
section{max-width:1180px;margin:auto;padding:130px 5vw 60px;min-height:80vh}
.hero{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:40px}
.tag{font-size:13px;letter-spacing:4px;color:var(--accent);font-weight:800}
h1{font-size:clamp(46px,8vw,104px);line-height:.9;margin:16px 0;font-weight:900;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:19px;color:var(--muted);max-width:460px}
.note{margin-top:26px;font-size:13px;border-left:4px solid var(--accent);padding:6px 12px;color:var(--muted)}
.comp{position:relative;aspect-ratio:1;max-width:440px;width:100%;justify-self:center}
.comp div{position:absolute;transition:transform .2s linear}
.comp .c1{width:58%;height:58%;border-radius:50%;background:var(--accent);top:4%;left:6%;mix-blend-mode:multiply}
[data-theme=dark] .comp .c1{mix-blend-mode:screen}
.comp .s1{width:48%;height:48%;background:var(--blue);right:4%;bottom:10%}
.comp .t1{width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:156px solid var(--yellow);left:8%;bottom:2%}
.comp .l1{width:100%;height:6px;background:var(--line);top:52%;left:0}
.comp .l2{width:6px;height:70%;background:var(--line);left:62%;top:0}
.scroll{margin-top:40px;font-size:12px;letter-spacing:4px;display:flex;gap:10px;align-items:center}
.scroll i{width:2px;height:40px;background:var(--fg);animation:sc 1.6s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.sh{display:flex;align-items:flex-end;gap:18px;margin-bottom:34px;border-bottom:3px solid var(--line);padding-bottom:14px}
.sh .n{font-size:70px;font-weight:900;color:var(--accent);line-height:.8}
.sh h2{margin:0;font-size:clamp(28px,4vw,44px);text-transform:uppercase;font-weight:900}
.sh p{margin:4px 0 0;color:var(--muted)}
.sh .geo{margin-left:auto;width:36px;height:36px;background:var(--fg)}
.geo.c{border-radius:50%}.geo.t{clip-path:polygon(50% 0,100% 100%,0 100%)}.geo.h{clip-path:polygon(0 0,100% 0,100% 100%)}
.card{background:var(--card);border:2px solid var(--line);box-shadow:8px 8px 0 var(--accent);padding:22px;position:relative;transition:box-shadow .3s}
.card h3{margin:0 0 4px;text-transform:uppercase;font-size:17px;letter-spacing:1px}
.card .hint{font-size:12px;color:var(--muted);margin-bottom:12px}
.info{position:absolute;top:14px;right:14px;width:28px;height:28px;font-family:inherit;font-weight:900;background:var(--fg);color:var(--bg);border:none}
.info:hover{background:var(--accent)}
.cbox{height:380px;position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.step{border:2px solid var(--line);margin-left:-2px;padding:20px 16px;background:var(--card);position:relative}
.step b{display:block;font-size:34px;font-weight:900}
.step span{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.step:last-child{background:var(--accent);color:#fff}.step:last-child span{color:#fff}
.step .bar{height:6px;background:var(--grid);margin-top:12px}.step .bar i{display:block;height:100%;background:var(--fg);width:0;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.feat{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.feat em{font-style:normal;border:2px solid var(--line);padding:3px 8px;background:var(--card)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.kpi{padding:26px 22px}
.kpi span{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:clamp(26px,3vw,38px);font-weight:900;margin-top:8px}
.kpi::after{content:"";position:absolute;right:14px;bottom:14px;width:14px;height:14px;background:var(--accent)}
.kpi:nth-child(2)::after{border-radius:50%}.kpi:nth-child(3)::after{clip-path:polygon(50% 0,100% 100%,0 100%)}
.synth{display:grid;gap:18px;counter-reset:s}
.ins{display:grid;grid-template-columns:70px 1fr;align-items:start;gap:16px;padding:20px}
.ins::before{counter-increment:s;content:"0" counter(s);font-size:40px;font-weight:900;color:var(--accent);line-height:1}
.ins h4{margin:0 0 6px;text-transform:uppercase;letter-spacing:1px}
.ins p{margin:0;font-size:16px;line-height:1.5}
.ins strong{color:var(--accent)}
.na{padding:40px;text-align:center;color:var(--muted);border:2px dashed var(--line)}
footer{text-align:center;padding:40px;font-size:12px;color:var(--muted);letter-spacing:2px;position:relative;z-index:1}
.pop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.pop.open{opacity:1;pointer-events:auto}
.pop-win{width:min(460px,90vw);background:var(--card);border:3px solid var(--line);box-shadow:12px 12px 0 var(--accent);transform:scale(.9) translateY(20px);transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.pop.open .pop-win{transform:none}
.pop-bar{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:8px 12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:13px}
.pop-bar .d{display:flex;gap:5px}.pop-bar .d i{width:11px;height:11px;display:block}
.d .c{background:var(--red);border-radius:50%}.d .s{background:var(--blue)}.d .t{background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}
.pop-bar button{margin-left:auto;background:none;border:none;color:var(--bg);font-size:16px;font-family:inherit}
#popB{padding:22px;font-size:16px;line-height:1.6}
#popB .big{font-size:30px;font-weight:900;color:var(--accent);display:block;margin-bottom:6px}
.reveal{opacity:0;transform:translateY(50px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}
@media(max-width:860px){.hero,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.pipe{grid-template-columns:1fr 1fr}.swatches{display:none}.comp{max-width:280px}}
</style>
</head>
<body>
<div id="loader">
  <div class="lshapes"><i class="c"></i><i class="s"></i><i class="t"></i></div>
  <div id="lpct">000%</div>
  <div id="lbar"></div>
  <div id="lmsg">loading</div>
</div>
<div id="progress"></div>
<canvas id="stars"></canvas>

<header class="top">
  <div class="logo"><i class="c"></i><i class="s"></i><i class="t"></i>&nbsp;MEDIA/SALES</div>
  <div class="ctrls">
    <button class="btn" id="upBtn">⬆ CSV</button>
    <input type="file" id="file" accept=".csv" hidden>
    <button class="btn lang" id="langBtn"><span data-l="en">EN</span> / <span data-l="fr">FR</span></button>
    <button class="btn theme" id="themeBtn" aria-label="theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="swatches">
      <button class="sw c" style="background:#D62828" data-c="#D62828"></button>
      <button class="sw" style="background:#1F4E9E" data-c="#1F4E9E"></button>
      <button class="sw t" style="background:#F2B705" data-c="#F2B705"></button>
      <label class="sw pick"><input type="color" id="pick" value="#D62828"></label>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <div class="tag reveal" data-i18n="heroTag"></div>
      <h1 class="reveal d1"><span data-i18n="h1a"></span><br><em data-i18n="h1b"></em></h1>
      <p class="sub reveal d2" data-i18n="heroSub"></p>
      <div class="note reveal d3" id="srcNote"></div>
      <div class="scroll reveal d3"><i></i><span>SCROLL</span></div>
    </div>
    <div class="comp" id="comp"><div class="c1" data-k="20"></div><div class="s1" data-k="-14"></div><div class="t1" data-k="30"></div><div class="l1" data-k="5"></div><div class="l2" data-k="-5"></div></div>
  </section>

  <section id="s1">
    <div class="sh reveal"><span class="n">01</span><div><h2 data-i18n="s1"></h2><p data-i18n="s1d"></p></div><i class="geo"></i></div>
    <div class="pipe reveal" id="pipe"></div>
    <div class="feat reveal" id="feat"></div>
  </section>

  <section id="s2">
    <div class="sh reveal"><span class="n">02</span><div><h2 data-i18n="s2"></h2><p data-i18n="s2d"></p></div><i class="geo c"></i></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <section id="s3">
    <div class="sh reveal"><span class="n">03</span><div><h2 data-i18n="s3"></h2><p data-i18n="s3d"></p></div><i class="geo t"></i></div>
    <div class="card reveal"><button class="info" data-info="i_trend">i</button><h3 data-i18n="s3"></h3><div class="hint" data-i18n="hint"></div><div class="cbox"><canvas id="cTrend"></canvas></div></div>
  </section>

  <section id="s4">
    <div class="sh reveal"><span class="n">04</span><div><h2 data-i18n="s4"></h2><p data-i18n="s4d"></p></div><i class="geo h"></i></div>
    <div class="grid2">
      <div class="card reveal"><button class="info" data-info="i_region">i</button><h3 data-i18n="t_region"></h3><div class="hint" data-i18n="hint"></div><div class="cbox"><canvas id="cRegion"></canvas></div></div>
      <div class="card reveal d1"><button class="info" data-info="i_cat">i</button><h3 data-i18n="t_cat"></h3><div class="hint" data-i18n="hint"></div><div class="cbox"><canvas id="cCat"></canvas></div></div>
    </div>
  </section>

  <section id="s5">
    <div class="sh reveal"><span class="n">05</span><div><h2 data-i18n="s5"></h2><p data-i18n="s5d"></p></div><i class="geo c"></i></div>
    <div class="grid2" id="discWrap">
      <div class="card reveal"><button class="info" data-info="i_scatter">i</button><h3 data-i18n="t_scatter"></h3><div class="hint" data-i18n="hint"></div><div class="cbox"><canvas id="cScatter"></canvas></div></div>
      <div class="card reveal d1"><button class="info" data-info="i_band">i</button><h3 data-i18n="t_band"></h3><div class="hint" data-i18n="hint"></div><div class="cbox"><canvas id="cBand"></canvas></div></div>
    </div>
    <div class="na" id="discNA" hidden data-i18n="noProfit"></div>
  </section>

  <section id="s6">
    <div class="sh reveal"><span class="n">06</span><div><h2 data-i18n="s6"></h2><p data-i18n="s6d"></p></div><i class="geo"></i></div>
    <div class="synth" id="synth"></div>
  </section>
</main>
<footer>MULTIMEDIA SHOP · SALES PERFORMANCE ANALYSIS</footer>

<div class="pop" id="pop"><div class="pop-win">
  <div class="pop-bar"><span class="d"><i class="c"></i><i class="s"></i><i class="t"></i></span><span id="popT"></span><button id="popX">✕</button></div>
  <div id="popB"></div>
</div></div>

/* ========== SAMPLE DATA (synthetic, seeded) ========== */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function generate(){
  const r=rng(42),rows=[];
  const cats={'Audio':[40,600,.26],'TV & Video':[250,2200,.13],'Gaming':[30,700,.19],'Computing':[300,2400,.11],'Smartphones':[150,1300,.16],'Accessories':[5,90,.38]};
  const regs={'Île-de-France':1.7,'North':.9,'East':.75,'West':1.0,'South':1.15};
  const season=[.8,.7,.85,.85,.9,.95,.9,.85,1,1.05,1.55,1.9];
  const pickW=o=>{const e=Object.entries(o),tot=e.reduce((s,[,w])=>s+w,0);let x=r()*tot;for(const[k,w]of e){if((x-=w)<0)return k}return e[0][0]};
  const catW={'Audio':1.2,'TV & Video':.6,'Gaming':1,'Computing':.6,'Smartphones':.9,'Accessories':1.6};
  const discs=[0,0,0,0,.1,.1,.15,.2,.2,.3,.4,.5];let id=10000;
  for(let m=0;m<12;m++){const n=Math.round(240*season[m]);for(let i=0;i<n;i++){
    const reg=pickW(regs),cat=pickW(catW),[lo,hi,bm]=cats[cat];
    const price=lo+(hi-lo)*r()**2,qty=1+Math.floor(r()*r()*4);
    let d=discs[Math.floor(r()*discs.length)];if(m===10&&r()<.4)d=[.3,.4,.5][Math.floor(r()*3)];
    if(reg==='East'&&r()<.3)d=Math.max(d,.3);
    const sales=price*qty*(1-d),prof=sales*(bm-d*1.2+(r()-.5)*.12);
    rows.push({'Order ID':'MM-'+(id++),'Order Date':new Date(Date.UTC(2025,m,1+Math.floor(r()*28))).toISOString().slice(0,10),Region:reg,Category:cat,Sales:sales.toFixed(2),Quantity:qty,Discount:d,Profit:prof.toFixed(2)});
  }}
  rows.forEach(o=>{if(r()<.025)o[['Region','Sales','Profit','Discount','Order Date'][Math.floor(r()*5)]]=''});
  const dup=Math.round(rows.length*.015);for(let i=0;i<dup;i++)rows.push({...rows[Math.floor(r()*rows.length)]});
  return rows;
}

/* ========== CLEANING ========== */
const num=v=>{if(v===''||v==null)return null;const n=typeof v==='number'?v:parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:null};
function pick(row,names){for(const k in row)if(names.includes(k.toLowerCase().trim()))return row[k];return undefined}
function clean(raw){
  const S={raw:raw.length,dup:0,miss:0,fill:0},seen=new Set(),uniq=[];
  raw.forEach(o=>{const k=JSON.stringify(o);if(seen.has(k))S.dup++;else{seen.add(k);uniq.push(o)}});
  const hasP=raw.some(o=>pick(o,['profit'])!==undefined),hasD=raw.some(o=>pick(o,['discount'])!==undefined);
  const out=[];
  uniq.forEach((o,i)=>{
    let sales=num(pick(o,['sales','revenue','amount']));
    const qty=num(pick(o,['quantity','quantity ordered','qty'])),price=num(pick(o,['price each','price','unit price']));
    if(sales==null&&qty!=null&&price!=null)sales=qty*price;
    const dv=pick(o,['order date','date','order_date']),date=dv?new Date(dv):null;
    const profit=hasP?num(pick(o,['profit'])):null;
    if(sales==null||!date||isNaN(date)||(hasP&&profit==null)){S.miss++;return}
    let region=pick(o,['region','city','state']);if(region==null||String(region).trim()===''){region='N/A';S.fill++}
    let category=pick(o,['category','product category','product','sub-category']);if(!category){category='N/A';S.fill++}
    let d=hasD?num(pick(o,['discount'])):0;if(d==null){d=0;S.fill++}if(d>1)d/=100;
    out.push({id:pick(o,['order id','order_id','orderid'])??i,date,region:String(region).trim(),category:String(category).trim(),sales,profit,discount:d});
  });
  S.final=out.length;S.features=['Order ID','Order Date','Region','Category','Sales',...(hasD?['Discount']:[]),...(hasP?['Profit']:[])];
  return{rows:out,S};
}

/* ========== ANALYSIS ========== */
function analyze(rows){
  const A={rows},sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  A.hasProfit=rows.some(x=>x.profit!=null);A.hasDisc=rows.some(x=>x.discount>0);
  A.sales=sum(rows,x=>x.sales);A.profit=sum(rows,x=>x.profit||0);A.orders=new Set(rows.map(x=>x.id)).size;
  const grp=f=>{const m={};rows.forEach(x=>{const k=f(x);(m[k]??={k,s:0,p:0,n:0});m[k].s+=x.sales;m[k].p+=x.profit||0;m[k].n++});return Object.values(m)};
  A.months=grp(x=>x.date.getFullYear()+'-'+String(x.date.getMonth()+1).padStart(2,'0')).sort((a,b)=>a.k<b.k?-1:1);
  A.regions=grp(x=>x.region).sort((a,b)=>b.s-a.s).slice(0,12);
  A.cats=grp(x=>x.category).sort((a,b)=>b.s-a.s).slice(0,10);
  const BL=['0%','1–10%','11–20%','21–30%','>30%'],bi=d=>{const p=Math.round(d*100);return p===0?0:p<=10?1:p<=20?2:p<=30?3:4};
  A.bands=BL.map(k=>({k,s:0,p:0,n:0}));rows.forEach(x=>{const b=A.bands[bi(x.discount)];b.s+=x.sales;b.p+=x.profit||0;b.n++});
  A.bands=A.bands.filter(b=>b.n);
  const n=rows.length,mx=sum(rows,x=>x.discount)/n,my=sum(rows,x=>x.profit||0)/n;
  let c=0,vx=0,vy=0;rows.forEach(x=>{const a=x.discount-mx,b=(x.profit||0)-my;c+=a*b;vx+=a*a;vy+=b*b});A.corr=vx&&vy?c/Math.sqrt(vx*vy):0;
  const step=Math.ceil(n/700);A.points=rows.filter((_,i)=>i%step===0);
  return A;
}

  const st=[['p_raw',S.raw],['p_dup',S.dup],['p_miss',S.miss],['p_fill',S.fill],['p_final',S.final]];
  $('#pipe').innerHTML=st.map(([k,v])=>`<div class="step"><b data-count="${v}">${v.toLocaleString(loc())}</b><span>${t(k)}</span><div class="bar"><i data-w="${Math.max(2,v/S.raw*100)}"></i></div></div>`).join('');
  $('#feat').innerHTML=`<span>${t('features')}</span>`+S.features.map(f=>`<em>${f}</em>`).join('');
  $('#srcNote').textContent=SRC?t('file')+SRC:t('sample');
}
let KF=[];
function renderKPIs(){
  const k=[['k_rev',A.sales,money],['k_profit',A.hasProfit?A.profit:null,money],['k_margin',A.hasProfit?A.profit/A.sales:null,pct],['k_orders',A.orders,v=>Math.round(v).toLocaleString(loc())]];

/* ========== REVEAL & COUNTERS ========== */
function countUp(el,to,f){const t0=performance.now(),d=1400;const step=n=>{const p=Math.min(1,(n-t0)/d),e=1-Math.pow(1-p,4);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
const revObs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add('in');
  el.querySelectorAll('[data-kv]').forEach(b=>{if(b.dataset.kv!=='')countUp(b,+b.dataset.kv,KF[+b.dataset.f])});
  el.querySelectorAll('[data-count]').forEach(b=>countUp(b,+b.dataset.count,v=>Math.round(v).toLocaleString(loc())));
  el.querySelectorAll('[data-w]').forEach(b=>setTimeout(()=>b.style.width=b.dataset.w+'%',150));
  revObs.unobserve(el)}),{threshold:.15});

  stars=Array.from({length:Math.min(220,innerWidth/6)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2,vx:(Math.random()-.5)*.15,vy:-Math.random()*.25-.05,ox:0,oy:0}))}
addEventListener('resize',size);size();
addEventListener('mousemove',e=>{const dpr=window.devicePixelRatio||1;mouse.x=e.clientX*dpr;mouse.y=e.clientY*dpr;mouse.nx=e.clientX/innerWidth-.5;mouse.ny=e.clientY/innerHeight-.5;
  $$('#comp div').forEach(d=>d.style.transform=`translate(${mouse.nx*d.dataset.k}px,${mouse.ny*d.dataset.k}px)`)});
(function loop(){cx.clearRect(0,0,W,H);const col=css('--star')||'17,17,17';const dpr=window.devicePixelRatio||1;
  for(const s of stars){s.x+=s.vx*s.z*dpr;s.y+=s.vy*s.z*dpr;if(s.y<-5)s.y=H+5;if(s.x<-5)s.x=W+5;if(s.x>W+5)s.x=-5;
    const px=s.x-mouse.nx*40*s.z,py=s.y-mouse.ny*40*s.z,dx=px-mouse.x,dy=py-mouse.y,d=Math.hypot(dx,dy),R=120*dpr;
    if(d<R){const f=(1-d/R)*18;s.ox+=dx/d*f*.1;s.oy+=dy/d*f*.1}s.ox*=.94;s.oy*=.94;
    const sz=s.z*1.8*dpr;cx.fillStyle=`rgba(${col},${.25+s.z*.5})`;cx.fillRect(px+s.ox,py+s.oy,sz,sz)}
  requestAnimationFrame(loop)})();
addEventListener('scroll',()=>{$('#progress').style.width=scrollY/(document.body.scrollHeight-innerHeight)*100+'%'});

/* ========== BOOT / LOADER (repaired) ========== */
(function boot(){
  applyLang();
  const bar=$('#lbar');
  for(let i=0;i<24;i++)bar.appendChild(document.createElement('i'));
  const blocks=[...bar.children];
  let p=0,phase=-1,finished=false;

  // Progress is purely cosmetic and can NEVER stall the page.
  const finish=()=>{
    if(finished)return;finished=true;
    if(A&&S){renderAll();observeReveals();resetCharts();}
    $('#loader').classList.add('done');
  };

  // safety net: if anything goes wrong, reveal the page anyway
  const guard=setTimeout(()=>{console.warn('boot watchdog fired');try{if(!A)bootData()}catch(e){}finish()},3000);

  function bootData(){
    if(A)return;
    try{const c=clean(generate());S=c.S;A=analyze(c.rows)}catch(e){console.error('bootData',e)}
  }

  function paint(){
    $('#lpct').textContent=String(Math.floor(p)).padStart(3,'0')+'%';
    blocks.forEach((b,i)=>b.classList.toggle('on',i<Math.round(p/100*24)));
    $('#lmsg').textContent=(t('loading')[phase]||'');
  }

  const tick=()=>{
    try{
      p=Math.min(100,p+(Math.random()*5+1.5));
      const ph=Math.min(4,Math.floor(p/25));
      if(ph!==phase){phase=ph;if(ph>=1)bootData()}
      paint();
    }catch(e){
      console.error('boot tick',e);
      finish();return;
    }
    if(p<100){setTimeout(tick,55)}
    else{clearTimeout(guard);setTimeout(finish,350)}
  };
  paint();
  tick();
})();

// final safety: if the DOM is already interactive and loader is somehow stuck
window.addEventListener('load',()=>{
  if(!A||!S){try{const c=clean(generate());S=c.S;A=analyze(c.rows);renderAll();observeReveals();resetCharts()}catch(e){console.error(e)}}
  $('#loader').classList.add('done');
});
</script>
